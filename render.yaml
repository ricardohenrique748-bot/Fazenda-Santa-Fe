# Render deploy config - usa migrate deploy (mais rápido que db push)
services:
  - type: web
    name: malut-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm ci && npm run build
    startCommand: npx prisma migrate deploy && npm run start:prod
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
