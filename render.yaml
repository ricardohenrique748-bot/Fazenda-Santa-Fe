# Force redeploy with fixed import paths and pinned prisma 6.2.1
services:
  - type: web
    name: malut-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm ci && npm run build
    startCommand: npx prisma db push --accept-data-loss && npm run start:prod
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
