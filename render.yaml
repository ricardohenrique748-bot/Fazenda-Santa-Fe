# Render deploy config
services:
  - type: web
    name: malut-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci && npm run build
    startCommand: export DATABASE_URL=$(echo $DATABASE_URL | tr -d '[:space:]') && npx prisma migrate deploy && node dist/main
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: NODE_ENV
        value: "production"
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
